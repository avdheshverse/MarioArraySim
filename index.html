<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Array Bros — Data Structure Simulator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
}

:root{
    --sky:#5c94fc;
    --yellow:#f8d820;
    --red:#e52521;
    --green:#43b047;
    --blue:#0085c7;
    --orange:#f68f14;
    --purple:#823c93;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    padding:22px 14px 40px;
    background:#171717;
    color:white;
    font-family:'Press Start 2P',monospace;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:min(1180px,100%);
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:18px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    text-align:center;
}

.header h1{
    font-size:
        clamp(
            20px,
            4vw,
            38px
        );
    color:var(--yellow);
    margin:8px 0 12px;
    text-shadow:4px 4px #000;
    line-height:1.4;
}

.header p{
    font-size:10px;
    color:#ddd;
    line-height:1.7;
    margin:0;
}


/* =========================================================
   GAME FRAME
========================================================= */

.game{
    position:relative;
    height:390px;
    border:6px solid #000;
    border-radius:9px;
    background:var(--sky);
    overflow:hidden;
    box-shadow:0 0 24px #000;
}

.sky{
    position:relative;
    height:325px;
    overflow:hidden;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud{
    position:absolute;
    font-size:42px;
    opacity:.78;
    pointer-events:none;
}

.cloud.c1{
    left:7%;
    top:24px;
}

.cloud.c2{
    right:12%;
    top:58px;
}

.cloud.c3{
    left:43%;
    top:100px;
    font-size:32px;
}


/* =========================================================
   HUD
========================================================= */

.hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    z-index:100;
    font-size:8px;
    line-height:1.7;
}

.hud span{
    background:#000;
    padding:8px 10px;
    border:2px solid white;
    transition:
        text-shadow .2s ease,
        color .2s ease;
}

#operationHud.star-mode{
    color:#ffe600;
    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffe600;
    animation:
        hudPulse .45s infinite alternate;
}

@keyframes hudPulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.04);
    }
}


/* =========================================================
   ARRAY CONTAINER
========================================================= */

#blocks{
    position:absolute;
    left:0;
    right:0;
    bottom:7px;
    height:82px;
    overflow:visible;
}


/* =========================================================
   ARRAY BLOCK
========================================================= */

.block{
    position:absolute;
    width:54px;
    height:54px;
    top:0;
    border:4px solid #000;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#000;
    font-size:14px;
    background:#f89828;

    box-shadow:
        inset -4px -4px #b85c00,
        inset 4px 4px #f8d870;

    transition:
        left .55s cubic-bezier(.22,.75,.25,1),
        top .45s cubic-bezier(.22,.75,.25,1),
        transform .35s ease,
        opacity .35s ease;

    z-index:10;

    will-change:
        left,
        top,
        transform,
        opacity;
}

.block .value{
    pointer-events:none;
}

.block .index{
    position:absolute;
    top:-17px;
    left:50%;
    transform:translateX(-50%);
    font-size:7px;
    color:white;
    text-shadow:2px 2px #000;
    white-space:nowrap;
}

.block .address{
    position:absolute;
    bottom:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:7px;
    color:white;
    text-shadow:2px 2px #000;
    white-space:nowrap;
}


/* =========================================================
   ARRAY STATES
========================================================= */

.block.check{
    background:#f83800;
    color:white;

    box-shadow:
        inset -4px -4px #881400,
        inset 4px 4px #f87858;

    transform:translateY(-4px);
}

.block.found{
    background:#00a800;
    color:white;

    box-shadow:
        inset -4px -4px #005800,
        inset 4px 4px #58d854;

    animation:
        blockBounce .45s infinite alternate;
}

.block.disabled{
    background:#777;
    color:#ddd;
    opacity:.48;

    box-shadow:
        inset -4px -4px #505050,
        inset 4px 4px #aaa;
}

.block.removing{
    transform:
        scale(0)
        rotate(180deg);
    opacity:0;
}

@keyframes blockBounce{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-8px);
    }
}


/* =========================================================
   MARIO
========================================================= */

#mario{
    position:absolute;
    left:24px;
    bottom:8px;
    width:38px;
    height:48px;
    z-index:60;
    opacity:1;

    transition:
        left .75s cubic-bezier(.22,.75,.25,1),
        bottom .28s cubic-bezier(.2,.8,.2,1),
        transform .22s ease;

    filter:
        drop-shadow(
            3px 4px 0
            rgba(0,0,0,.4)
        );

    pointer-events:none;

    will-change:
        left,
        bottom,
        transform;
}


/* =========================================================
   PIXEL MARIO
========================================================= */

.mario-pixel{
    position:absolute;
    left:0;
    top:0;
    width:4px;
    height:4px;
    image-rendering:pixelated;

    box-shadow:

        8px 0 #e52521,
        12px 0 #e52521,
        16px 0 #e52521,
        20px 0 #e52521,
        24px 0 #e52521,

        4px 4px #e52521,
        8px 4px #e52521,
        12px 4px #e52521,
        16px 4px #e52521,
        20px 4px #e52521,
        24px 4px #e52521,
        28px 4px #e52521,

        8px 8px #f3a36b,
        12px 8px #f3a36b,
        16px 8px #f3a36b,
        20px 8px #f3a36b,
        24px 8px #f3a36b,
        28px 8px #f3a36b,

        8px 12px #f3a36b,
        12px 12px #111,
        16px 12px #f3a36b,
        20px 12px #111,
        24px 12px #f3a36b,
        28px 12px #f3a36b,

        4px 16px #6b351d,
        8px 16px #6b351d,
        12px 16px #f3a36b,
        16px 16px #f3a36b,
        20px 16px #f3a36b,
        24px 16px #f3a36b,
        28px 16px #6b351d,

        4px 20px #e52521,
        8px 20px #e52521,
        12px 20px #e52521,
        16px 20px #e52521,
        20px 20px #e52521,
        24px 20px #e52521,
        28px 20px #e52521,

        8px 24px #1455a3,
        12px 24px #1455a3,
        16px 24px #1455a3,
        20px 24px #1455a3,
        24px 24px #1455a3,

        8px 28px #1455a3,
        12px 28px #1455a3,
        16px 28px #1455a3,
        20px 28px #1455a3,
        24px 28px #1455a3,

        0 24px #f3a36b,
        4px 24px #e52521,
        28px 24px #e52521,
        32px 24px #f3a36b,

        8px 32px #1455a3,
        12px 32px #1455a3,
        20px 32px #1455a3,
        24px 32px #1455a3,

        8px 36px #6b351d,
        12px 36px #6b351d,
        20px 36px #6b351d,
        24px 36px #6b351d,

        4px 40px #111,
        8px 40px #111,
        20px 40px #111,
        24px 40px #111;
}


/* =========================================================
   MARIO ANIMATIONS
========================================================= */

#mario.idle{
    animation:
        marioIdle .75s ease-in-out infinite alternate;
}

#mario.running{
    animation:
        marioRun .16s infinite alternate;
}

#mario.jump{
    animation:
        marioJump .48s cubic-bezier(.25,.8,.25,1);
}

#mario.hit{
    animation:
        marioHit .4s cubic-bezier(.25,.8,.25,1);
}

#mario.stomp{
    animation:
        marioStomp .5s cubic-bezier(.25,.8,.25,1);
}

#mario.star{
    animation:
        marioStar .22s infinite alternate;
}

#mario.fail{
    animation:
        marioFail .28s infinite alternate;
}

@keyframes marioIdle{
    0%{
        transform:
            translateY(0)
            scaleX(1);
    }

    100%{
        transform:
            translateY(-2px)
            scaleX(.98);
    }
}

@keyframes marioRun{
    0%{
        transform:
            translateY(0)
            scaleX(1);
    }

    50%{
        transform:
            translateY(-3px)
            scaleX(.95);
    }

    100%{
        transform:
            translateY(0)
            scaleX(1.02);
    }
}

@keyframes marioJump{
    0%{
        transform:
            translateY(0)
            rotate(0)
            scale(1);
    }

    35%{
        transform:
            translateY(-18px)
            rotate(-4deg)
            scale(1.04);
    }

    65%{
        transform:
            translateY(-12px)
            rotate(3deg)
            scale(1.02);
    }

    100%{
        transform:
            translateY(0)
            rotate(0)
            scale(1);
    }
}

@keyframes marioHit{
    0%{
        transform:
            translateY(0)
            rotate(0);
    }

    35%{
        transform:
            translateY(-10px)
            rotate(-8deg);
    }

    70%{
        transform:
            translateY(2px)
            rotate(5deg);
    }

    100%{
        transform:
            translateY(0)
            rotate(0);
    }
}

@keyframes marioStomp{
    0%{
        transform:
            translateY(0)
            scale(1);
    }

    35%{
        transform:
            translateY(-23px)
            scale(1.04);
    }

    65%{
        transform:
            translateY(3px)
            scale(1.08);
    }

    80%{
        transform:
            translateY(-2px)
            scale(.98);
    }

    100%{
        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes marioStar{
    0%{
        transform:
            rotate(-5deg)
            scale(1);

        filter:
            drop-shadow(
                3px 4px 0
                rgba(0,0,0,.4)
            )
            drop-shadow(
                0 0 5px white
            );
    }

    100%{
        transform:
            rotate(5deg)
            scale(1.12);

        filter:
            drop-shadow(
                3px 4px 0
                rgba(0,0,0,.4)
            )
            drop-shadow(
                0 0 16px white
            );
    }
}

@keyframes marioFail{
    0%{
        transform:
            translateX(-2px);
    }

    50%{
        transform:
            translateX(2px);
    }

    100%{
        transform:
            translateX(-2px);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.game-particle{
    position:absolute;
    width:7px;
    height:7px;
    z-index:55;
    pointer-events:none;

    animation:
        particleFly .75s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

.game-particle.coin{
    width:8px;
    height:12px;
    background:#ffd92e;
    border:2px solid #8a6200;
    border-radius:50%;
}

.game-particle.dust{
    width:6px;
    height:6px;
    background:#fff;
    border:2px solid #888;
}

.game-particle.spark{
    background:#fff;
    box-shadow:0 0 5px white;
}

@keyframes particleFly{
    0%{
        opacity:1;
        transform:
            translate(0,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}


/* =========================================================
   STAR BURST
========================================================= */

.star-burst{
    position:absolute;
    z-index:58;
    font-size:18px;
    pointer-events:none;

    animation:
        starBurst .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes starBurst{
    0%{
        opacity:0;

        transform:
            scale(.2)
            rotate(0);
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            scale(1.8)
            rotate(180deg)
            translateY(-25px);
    }
}


/* =========================================================
   MARIO ACTION POLISH
========================================================= */

#mario.impact .mario-pixel{
    animation:
        marioImpactFlash .16s
        steps(2,end) 2;
}

@keyframes marioImpactFlash{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:
            brightness(1.8)
            drop-shadow(0 0 8px #fff);
    }
}

.block.value-pop{
    z-index:25;

    animation:
        valuePop .7s
        cubic-bezier(.2,.9,.25,1);
}

@keyframes valuePop{
    0%{
        transform:
            translateY(0)
            scale(1);
    }

    25%{
        transform:
            translateY(-24px)
            scale(1.12);
    }

    55%{
        transform:
            translateY(-12px)
            scale(1.06);
    }

    100%{
        transform:
            translateY(0)
            scale(1);
    }
}

.impact-ring{
    position:absolute;
    width:18px;
    height:18px;
    border:4px solid #fff;
    border-radius:50%;
    z-index:57;
    pointer-events:none;

    animation:
        impactRing .55s ease-out forwards;

    transform:
        translate(-50%,-50%);
}

@keyframes impactRing{
    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(3.8);
    }
}


/* =========================================================
   BINARY SEARCH MARKERS
========================================================= */

.binary-markers{
    position:absolute;
    inset:0;
    z-index:45;
    pointer-events:none;
}

.binary-marker{
    position:absolute;
    min-width:54px;
    text-align:center;
    transform:translateX(-50%);

    transition:
        left .45s cubic-bezier(.22,.75,.25,1),
        top .3s ease,
        opacity .2s ease;

    opacity:0;

    font-size:7px;
    line-height:1.2;
    text-shadow:2px 2px #000;
}

.binary-marker.show{
    opacity:1;
}

.binary-marker .marker-label{
    display:block;
    padding:4px 5px;
    border:2px solid #000;
    background:#111;
    box-shadow:
        2px 2px 0
        rgba(0,0,0,.55);
}

.binary-marker .marker-arrow{
    display:block;
    margin-top:2px;
    font-size:12px;
    line-height:10px;
}

.binary-marker.low .marker-label{
    color:#6ec8ff;
    border-color:#6ec8ff;
}

.binary-marker.mid .marker-label{
    color:#ffe600;
    border-color:#ffe600;
}

.binary-marker.high .marker-label{
    color:#ff7772;
    border-color:#ff7772;
}

.binary-marker.low .marker-arrow{
    color:#6ec8ff;
}

.binary-marker.mid .marker-arrow{
    color:#ffe600;
}

.binary-marker.high .marker-arrow{
    color:#ff7772;
}

.binary-marker.low.same-position{
    margin-left:-24px;
}

.binary-marker.high.same-position{
    margin-left:24px;
}

.binary-range-line{
    position:absolute;
    height:3px;
    background:#ffe600;
    box-shadow:
        0 0 5px
        rgba(255,230,0,.7);

    opacity:0;

    transition:
        left .45s ease,
        width .45s ease,
        opacity .2s ease;
}

.binary-range-line.show{
    opacity:.8;
}


/* =========================================================
   GROUND
========================================================= */

.ground{
    height:65px;
    background:#c84c0c;

    border-top:
        6px solid #000;

    background-image:

        linear-gradient(
            45deg,
            rgba(0,0,0,.18) 25%,
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.18) 75%
        ),

        linear-gradient(
            -45deg,
            rgba(0,0,0,.18) 25%,
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.18) 75%
        );

    background-size:
        32px 32px;
}


/* =========================================================
   BUTTONS
========================================================= */

.controls{
    display:grid;
    grid-template-columns:
        repeat(5,1fr);
    gap:9px;
}

.btn{
    min-height:52px;

    padding:
        8px 6px;

    border:
        4px solid #000;

    color:white;
    cursor:pointer;

    font-size:8px;
    line-height:1.5;

    box-shadow:

        inset -3px -3px
        rgba(0,0,0,.4),

        inset 3px 3px
        rgba(255,255,255,.3);

    transition:
        transform .1s,
        filter .1s,
        opacity .1s;
}

.btn:hover:not(:disabled){
    filter:
        brightness(1.15);
}

.btn:active:not(:disabled){
    transform:
        scale(.96);
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.b-red{
    background:var(--red);
}

.b-green{
    background:var(--green);
}

.b-blue{
    background:var(--blue);
}

.b-orange{
    background:var(--orange);
}

.b-purple{
    background:var(--purple);
}


/* =========================================================
   PANEL
========================================================= */

.panel{
    background:#0b0b0b;

    border:
        4px dashed
        var(--yellow);

    border-radius:8px;
    padding:18px;

    display:none;
    gap:14px;
}

.panel.show{
    display:flex;
    flex-direction:column;
}

.panel h2{
    margin:0;
    color:var(--yellow);
    font-size:12px;
    line-height:1.7;
}

.fields{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:8px;
    color:#ccc;
    line-height:1.6;
}

.input{
    width:100%;

    padding:
        11px 9px;

    background:#202020;
    color:#58d854;

    border:
        2px solid white;

    outline:none;
    font-size:10px;
}

.input:focus{
    border-color:
        var(--yellow);
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}


/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;

    background:#090909;

    border:
        2px solid #333;

    padding:10px;

    font-size:7px;
    color:#aaa;
    line-height:1.7;
}

.statusbar b{
    color:white;
}


/* =========================================================
   LEGEND
========================================================= */

.legend{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    font-size:7px;
    color:#bbb;

    background:#0d0d0d;

    border:
        2px solid #333;

    padding:12px;
}

.legend span{
    display:flex;
    align-items:center;
    gap:7px;
}

.dot{
    width:12px;
    height:12px;

    border:
        2px solid #000;

    display:inline-block;
}

.d-normal{
    background:#f89828;
}

.d-check{
    background:#f83800;
}

.d-found{
    background:#00a800;
}

.d-disabled{
    background:#777;
}


/* =========================================================
   CONSOLE
========================================================= */

.console-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    color:var(--yellow);
    font-size:10px;

    transform:translateY(-3px);
}

.link-btn{
    border:0;
    background:none;
    color:white;
    cursor:pointer;

    font:inherit;
    font-size:8px;
}

.link-btn:hover{
    color:
        var(--yellow);
}

.console{
    height:220px;

    background:#000;

    border:
        4px solid white;

    border-radius:8px;

    padding:14px;

    overflow:auto;

    font-size:9px;
    line-height:1.7;
}

.line{
    margin-bottom:8px;
}

.line.action{
    color:var(--yellow);
}

.line.success{
    color:#58d854;
}

.line.error{
    color:#ff4b45;
}

.line.info{
    color:white;
}

.line.step{
    color:#6ec8ff;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .controls{
        grid-template-columns:
            repeat(3,1fr);
    }

    .fields{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:560px){

    body{
        padding:
            12px 8px 30px;
    }

    .game{
        height:360px;
    }

    .sky{
        height:295px;
    }

    .controls{
        grid-template-columns:
            repeat(2,1fr);
    }

    .fields{
        grid-template-columns:1fr;
    }

    .legend{
        grid-template-columns:
            repeat(2,1fr);
    }

    .console{
        height:190px;
    }

    .block{
        width:48px;
        height:48px;
    }

}

@media(max-width:380px){

    .block{
        width:44px;
        height:44px;

let audioCtx = null;

function initAudio(){

    if(!audioCtx){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext)
            return;

        audioCtx =
            new AudioContext();

    }

}


function resumeAudio(){

    initAudio();

    if(
        audioCtx &&
        audioCtx.state === 'suspended'
    ){

        audioCtx.resume();

    }

}


function tone(
    frequency,
    duration=0.08,
    type='square',
    volume=0.045,
    slide=0
){

    if(!audioCtx)
        return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    const now =
        audioCtx.currentTime;


    osc.type =
        type;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    osc.frequency.linearRampToValueAtTime(
        Math.max(
            30,
            frequency + slide
        ),
        now + duration
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    osc.connect(gain);
    gain.connect(audioCtx.destination);


    osc.start(now);

    osc.stop(
        now + duration + 0.02
    );

}

/* =========================================================
   LAYOUT
========================================================= */

function getLayout(){

    const sample =
        blocks.querySelector(
            '.block'
        );


    let width =
        54;

    let gap =
        12;


    if(sample){

        width =
            sample
            .getBoundingClientRect()
            .width;

    }

    else if(
        window.innerWidth <= 380
    ){

        width =
            44;

        gap =
            10;

    }

    else if(
        window.innerWidth <= 560
    ){

        width =
            48;

        gap =
            10;

    }


    const stride =
        width + gap;


    const containerWidth =
        blocks
        .getBoundingClientRect()
        .width;


    const total =
        arrayState.length

            ?

        (
            arrayState.length *
            stride
            -
            gap
        )

            :

        0;


    const start =
        Math.max(

            4,

            (
                containerWidth -
                total
            ) / 2

        );


    return {

        width,

        gap,

        stride,

        start

    };

}

function marioPositionForIndex(
    index
){

    const layout =
        getLayout();


    return (

        layout.start

        layout.stride

        layout.width / 2

        19

    );

}

    token
){

    if(
        index < 0 ||
        index >= arrayState.length

    clearInterval(
        runSoundTimer

            'div'
        );

        mario.getBoundingClientRect();

        sky.getBoundingClientRect();


    return {

        x:
            marioRect.left
            -
            skyRect.left
            +
            marioRect.width / 2,

        y:
            marioRect.top
            -
            skyRect.top
            +
            marioRect.height

    };

}

function createDust(
    position
){

    if(!position)
        return;


    const vectors = [

        [-18,-3],

        [-10,-8],

        [10,-8],

        [18,-3]

    ];


    vectors.forEach(
        ([dx,dy]) => {

            createParticle(

                'dust',

                position.x,

                position.y,

                dx,

                dy

            );

        }
    );

}


/* =========================================================
   COINS
========================================================= */

function createCoins(
    index,
    count=6
){

    const layout =
        getLayout();


    const x =
        layout.start
        +
        index *
        layout.stride
        +
        layout.width/2;


    const y =
        90;


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            (
                Math.PI * 2 /
                count
            ) * i;


        const radius =
            20 +
            Math.random() * 30;


        soundCoin();


        createParticle(

            'coin',

            x,

            y,

            Math.cos(angle) *
                radius,

            -30 -
                Math.random()*45

        );

    }

}

            <span class="marker-label">

            </span>

            <span class="marker-arrow">
                ↓
            </span>
        `;


        binaryMarkers.appendChild(
            marker
        );

    }


    return marker;

}


function showBinaryMarkers(
    low,
    mid,
    high
){

    const markerData = [

        ['low',low],

        ['mid',mid],

        ['high',high]

    ];


    const skyRect =
        sky.getBoundingClientRect();


    markerData.forEach(
        ([role,index]) => {

            const marker =
                ensureBinaryMarker(
                    role
                );


            const element =
                document.getElementById(
                    `block-${arrayState[index].id}`
                );


            if(!element)
                return;


            const rect =
                element.getBoundingClientRect();


            marker.style.left =
                `${rect.left - skyRect.left + rect.width/2}px`;


            marker.style.top =
                `${Math.max(
                    145,
                    rect.top -
                    skyRect.top -
                    48
                )}px`;


            marker.dataset.index =
                String(index);


            marker.classList.toggle(
                'same-position',
                low === high &&
                role !== 'mid'
            );


            marker.classList.add(
                'show'
            );

        }
    );

}


function repositionBinaryMarkers(){

    if(!binaryMarkers)
        return;


    const visible =
        binaryMarkers.querySelectorAll(
            '.binary-marker.show'
        );


    const skyRect =
        sky.getBoundingClientRect();


    visible.forEach(
        marker => {

            const index =
                Number(
                    marker.dataset.index
                );


            if(
                !Number.isInteger(index)
                ||
                !arrayState[index]
            )
                return;


            const element =
                document.getElementById(
                    `block-${arrayState[index].id}`
                );


            if(!element)
                return;


            const rect =
                element.getBoundingClientRect();


            marker.style.left =
                `${rect.left - skyRect.left + rect.width/2}px`;


            marker.style.top =
                `${Math.max(
                    145,
                    rect.top -
                    skyRect.top -
                    48
                )}px`;

        }
    );

}


function hideBinaryMarkers(){

    if(!binaryMarkers)

/* =========================================================
   RENDER
========================================================= */

function render(
    base=baseAddress,
    size=elementSize
){

    const layout =
        getLayout();


    arrayState.forEach(
        (
            item,
            index
        ) => {


            let element =
                document.getElementById(
                    `block-${item.id}`
                );


            if(!element){

                element =
                    document.createElement(
                        'div'
                    );


                element.id =
                    `block-${item.id}`;


                element.className =
                    'block';


                element.style.left =
                    `${layout.start
                    +
                    index *
                    layout.stride}px`;


                element.style.top =
                    '-70px';


                element.style.opacity =
                    '0';


                element.innerHTML = `

                    <span class="value"></span>

                    <span class="index"></span>

                    <span class="address"></span>

                `;


                blocks.appendChild(
                    element
                );


                requestAnimationFrame(
                    () => {

                        element.style.top =
                            '0px';

                        element.style.opacity =
                            '1';

                    }
                );

            }


            element.style.left =
                `${layout.start
                +
                index *
                layout.stride}px`;


            element.style.top =
                '0px';


            element.className =
                'block';


            if(
                item.status
            ){

                element.classList.add(
                    item.status
                );

            }


            element.querySelector(
                '.value'
            ).textContent =
                item.value;


            element.querySelector(
                '.index'
            ).textContent =
                `INDEX ${index}`;


            element.querySelector(
                '.address'
            ).textContent =
                base +
                index * size;

        }
    );


    [
        ...blocks.children
    ]
    .forEach(
        element => {

            const exists =
                arrayState.some(
                    item =>
                        `block-${item.id}`
                        ===
                        element.id
                );


            if(!exists){

                element.classList.add(
                    'removing'
                );


                setTimeout(
                    () => {

                        if(
                            element.parentNode
                        ){

                            element.remove();

                        }

                    },
                    360
                );

            }

        }
    );


    updateStatus();

}

/* =========================================================
   READ NUMBER
========================================================= */

function readNumber(
    id
){

    const element =
        $(id);


    if(!element)
        return NaN;


    const value =
        Number(
            element.value
        );


    if(
        !Number.isFinite(value)
    ){

        return NaN;

    }


    return Math.trunc(
        value
    );

}

){

/* =========================================================
   ADDRESS CALCULATION
========================================================= */

async function addressCalc(){

    const token =
        beginAnimation();


    clearLog();

    setLocked(true);


    const base =
        readNumber(
            'field-base'
        );


    const width =
        readNumber(
            'field-size'
        );


    const lb =
        readNumber(
            'field-lb'
        );


    const index =
        readNumber(
            'field-index'
        );


    log(
        '== ADDRESS CALCULATION ==',
        'action'
    );


    if(
        [base,width,lb,index]
            .some(
                Number.isNaN
            )
        ||
        width <= 0
    ){

        log(
            'Invalid address calculation input.',
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    baseAddress =
        base;


    elementSize =
        width;


    const offset =
        index -
        lb;


    const address =
        base +
        width *
        offset;


    log(
        'Formula: Address = Base + W × (Index − LB)',
        'step'
    );


    log(
        `Offset = ${index} − ${lb} = ${offset}`,
        'step'
    );


    log(
        `Address = ${base} + ${width} × ${offset}`,
        'step'
    );


    log(
        `Calculated Address = ${address}`,
        'success'
    );


    soundSuccess();


    if(
        offset >= 0 &&
        offset < arrayState.length
    ){

        await marioRunTo(
            offset,
            token
        );


        if(!valid(token))
            return;


        arrayState[offset]
            .status =
            'found';


        render(
            base,
            width
        );


        await marioStarPower(
            token,
            offset
        );


        resetStatuses();


        await marioReturnHome(
            token
        );

    }

    else{

        log(
            'Index is outside the current array.',
            'info'
        );


        soundFail();


        await marioFail(
            token
        );


        await marioReturnHome(
            token
        );

    }


    setLocked(false);

    closeMode();

}


/* =========================================================
   INSERTION
========================================================= */

async function insertion(){

    const token =
        beginAnimation();


    clearLog();

    setLocked(true);


    const index =
        readNumber(
            'field-index'
        );


    const value =
        readNumber(
            'field-value'
        );


    log(
        '== ARRAY INSERTION ==',
        'action'
    );


    if(
        Number.isNaN(index)
        ||
        Number.isNaN(value)
        ||
        index < 0
        ||
        index > arrayState.length
    ){

        log(
            `Invalid index. Use 0 to ${arrayState.length}.`,
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    if(
        arrayState.length >=
        MAX_SIZE
    ){

        log(
            `Array is full. Maximum size is ${MAX_SIZE}.`,
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    log(
        `Mario runs to insertion point ${index}.`,
        'step'
    );


    if(
        index < arrayState.length
    ){

        await marioRunTo(
            index,
            token
        );


        if(!valid(token))
            return;


        await marioHit(
            token
        );


        if(!valid(token))
            return;


        const layout =
            getLayout();


        log(
            'Mario hits the block — elements shift right!',
            'step'
        );


        for(
            let i =
                arrayState.length - 1;

            i >= index;

            i--
        ){

            const item =
                arrayState[i];


            const element =
                document.getElementById(
                    `block-${item.id}`
                );


            if(element){

                element.style.left =
                    `${layout.start
                    +
                    (i+1)
                    *
                    layout.stride}px`;

            }


            log(
                `${item.value}: ${i} → ${i+1}`,
                'step'
            );


            await sleep(150);


            if(!valid(token))
                return;

        }


        await sleep(250);

    }


    const item = {

        id:
            uid(),

        value:
            value,

        status:
            ''

    };


    arrayState.splice(
        index,
        0,
        item
    );


    render();


    await sleep(220);


    if(!valid(token))
        return;


    const insertedElement =
        document.getElementById(
            `block-${item.id}`
        );


    if(insertedElement){

        insertedElement.classList.add(
            'value-pop'
        );

    }


    arrayState[index]
        .status =
        'found';


    render();


    const insertedAfterRender =
        document.getElementById(
            `block-${item.id}`
        );


    if(insertedAfterRender){

        insertedAfterRender.classList.add(
            'value-pop'
        );

    }


    createCoins(
        index,
        6
    );


    log(
        `${value} inserted at index ${index}!`,
        'success'
    );


    soundSuccess();


    await sleep(650);


    resetStatuses();


    await marioReturnHome(
        token
    );


    setLocked(false);

    closeMode();

}

/* =========================================================
   LINEAR SEARCH
========================================================= */

async function linearSearch(){

    const token =
        beginAnimation();


    clearLog();

    setLocked(true);


    const target =
        readNumber(
            'field-value'
        );


    log(
        '== LINEAR SEARCH ==',

    );


    if(

    ){

        log(
            'Invalid search value.',
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    if(
        !arrayState.length
    ){

        log(
            'Array is empty.',
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    resetStatuses();


    log(
        `Mario searches for ${target}.`
    );


    for(
        let i=0;

        i<arrayState.length;

        i++
    ){

        if(!valid(token))
            return;


        arrayState.forEach(
            item => {

                if(
                    item.status ===
                    'check'
                ){

                    item.status =
                        'disabled';

                }

            }
        );


        arrayState[i]
            .status =
            'check';


        render();


        await marioRunTo(
            i,
            token
        );


        if(!valid(token))
            return;


        soundSearch();


        log(
            `Checking index ${i}: ${arrayState[i].value}`,
            'step'
        );


        await sleep(300);


        if(
            arrayState[i].value ===
            target
        ){

                .status =

            render();


            log(
                `MARIO FOUND ${target} at index ${i}!`,

            );


            soundSuccess();

                token,
                i
            );


            resetStatuses();


            await marioReturnHome(
                token
            );


            setLocked(false);

            closeMode();

            return;

        }


        arrayState[i]
            .status =
            'disabled';


        render();


        await sleep(180);

    }


    log(
        `Mario couldn't find ${target}.`,
        'error'
    );


    soundFail();


    await marioFail(
        token
    );


    resetStatuses();


    await marioReturnHome(
        token
    );


    setLocked(false);

    closeMode();

}


/* =========================================================
   SORTING FOR BINARY SEARCH
========================================================= */

async function animateSortCompare(
    i,
    j,
    token
){

    if(!valid(token))
        return false;


    arrayState.forEach(
        item =>
            item.status = ''
    );


    if(
        i >= 0 &&
        i < arrayState.length
    ){

        arrayState[i].status =
            'check';

    }


    if(
        j >= 0 &&
        j < arrayState.length
    ){

        arrayState[j].status =
            'check';

    }


    render();


    soundCompare();


    log(
        `Comparing index ${i} (${arrayState[i].value}) and index ${j} (${arrayState[j].value}).`,
        'step'
    );


    await sleep(260);


    return valid(token);

}


function swapArrayItems(
    i,
    j
){

    const temp =
        arrayState[i];

    arrayState[i] =
        arrayState[j];

    arrayState[j] =
        temp;


    soundSwap();

}


/* =========================================================
   BUBBLE SORT
========================================================= */

async function bubbleSort(
    token
){

    log(
        '== BUBBLE SORT ==',
        'action'
    );


    const n =
        arrayState.length;


    for(
        let i=0;
        i<n-1;
        i++
    ){

        let swapped =
            false;


        for(
            let j=0;
            j<n-i-1;
            j++
        ){

            if(
                !await animateSortCompare(
                    j,
                    j+1,
                    token
                )
            )
                return false;


            if(
                arrayState[j].value >
                arrayState[j+1].value
            ){

                swapArrayItems(
                    j,
                    j+1
                );


                swapped =
                    true;


                render();


                log(
                    `Swap → ${arrayState[j].value} and ${arrayState[j+1].value}.`,
                    'info'
                );


                await sleep(220);

            }

        }


        if(!swapped)
            break;

    }


    return true;

}


/* =========================================================
   INSERTION SORT
========================================================= */

async function insertionSort(
    token
){

    log(
        '== INSERTION SORT ==',
        'action'
    );


    for(
        let i=1;
        i<arrayState.length;
        i++
    ){

        const key =
            arrayState[i];


        let j =
            i-1;


        log(
            `Insert ${key.value} into the sorted portion.`,
            'step'
        );


        while(
            j >= 0 &&
            arrayState[j].value >
            key.value
        ){

            if(
                !await animateSortCompare(
                    j,
                    j+1,
                    token
                )
            )
                return false;


            arrayState[j+1] =
                arrayState[j];


            render();


            log(
                `Shift ${arrayState[j].value} one position right.`,
                'info'
            );


            await sleep(220);


            j--;

        }


        arrayState[j+1] =
            key;


        render();


        await sleep(220);

    }


    return true;

}


/* =========================================================
   SELECTION SORT
========================================================= */

async function selectionSort(
    token
){

    log(
        '== SELECTION SORT ==',
        'action'
    );


    const n =
        arrayState.length;


    for(
        let i=0;
        i<n-1;
        i++
    ){

        let minIndex =
            i;


        for(
            let j=i+1;
            j<n;
            j++
        ){

            if(
                !await animateSortCompare(
                    minIndex,
                    j,
                    token
                )
            )
                return false;


            if(
                arrayState[j].value <
                arrayState[minIndex].value
            ){

                minIndex =
                    j;


                log(
                    `New minimum: ${arrayState[minIndex].value}.`,
                    'info'
                );

            }

        }


        if(
            minIndex !== i
        ){

            swapArrayItems(
                i,
                minIndex
            );


            render();


            log(
                `Place ${arrayState[i].value} at index ${i}.`,
                'info'
            );


            await sleep(300);

        }

    }


    return true;

}


/* =========================================================
   SORT FOR BINARY SEARCH
========================================================= */

async function sortForBinarySearch(
    method,
    token
){

    resetStatuses();


    let success =
        false;


    if(
        method ===
        'bubble'
    ){

        success =
            await bubbleSort(
                token
            );

    }

    else if(
        method ===
        'insertion'
    ){

        success =
            await insertionSort(
                token
            );

    }

    else if(
        method ===
        'selection'
    ){

        success =
            await selectionSort(
                token
            );

    }


    if(!success)
        return false;


    resetStatuses();


    log(
        `Sorted array = [${arrayState
            .map(
                item =>
                    item.value
            )
            .join(', ')}]`,
        'success'
    );


    soundSortComplete();


    await sleep(500);


    return valid(token);

}


/* =========================================================
   BINARY SEARCH
========================================================= */

async function binarySearch(){

    const token =
        beginAnimation();


    clearLog();

    setLocked(true);


    const target =
        readNumber(
            'field-value'
        );


    log(
        '== BINARY SEARCH ==',
        'action'
    );


    if(
        Number.isNaN(target)
    ){

        log(
            'Invalid search value.',
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    if(
        !arrayState.length
    ){

        log(
            'Array is empty.',
            'error'
        );


        soundFail();


        marioIdle();

        setLocked(false);

        return;

    }


    const sorted =
        arrayState.every(
            (
                item,
                index,
                arr
            ) =>

                index === 0

                ||

                arr[index-1].value
                <=
                item.value

        );


    if(!sorted){

        const sortMethod =
            $('field-sort')
                ?
                $('field-sort').value
                :
                'bubble';


        const sortNames = {

            bubble:
                'Bubble Sort',

            insertion:
                'Insertion Sort',

            selection:
                'Selection Sort'

        };


        log(
            'Binary search requires sorted data.',
            'step'
        );


        log(
            `Sorting method: ${
                sortNames[sortMethod]
                ||
                'Bubble Sort'
            }.`,
            'info'
        );


        const sortedSuccessfully =
            await sortForBinarySearch(
                sortMethod,
                token
            );


        if(!sortedSuccessfully)
            return;

    }


    let low =
        0;


    let high =
        arrayState.length - 1;


    while(
        low <= high
    ){

        if(!valid(token))
            return;


        arrayState.forEach(
            item =>
                item.status=''
        );


        for(
            let i=0;
            i<low;
            i++
        ){

            arrayState[i]
                .status =
                'disabled';

        }


        for(
            let i=high+1;
            i<arrayState.length;
            i++
        ){

            arrayState[i]
                .status =
                'disabled';

        }


        render();


        const mid =
            Math.floor(
                (low+high)/2
            );


        showBinaryMarkers(
            low,
            mid,
            high
        );


        log(
            `LOW=${low}   MID=${mid}   HIGH=${high}`,
            'step'
        );


        await marioRunTo(
            mid,
            token
        );


        if(!valid(token))
            return;


        arrayState[mid]
            .status =
            'check';


        render();


        soundSearch();


        log(
            `Mario checks ${arrayState[mid].value}.`,
            'step'
        );


        await sleep(450);


        if(
            arrayState[mid].value ===
            target
        ){

            arrayState[mid]
                .status =
                'found';


            render();


            log(
                `BINGO! Mario found ${target} at index ${mid}!`,
                'success'
            );


            soundSuccess();


            await marioStarPower(
                token,
                mid
            );


            resetStatuses();


            hideBinaryMarkers();


            await marioReturnHome(
                token
            );


            setLocked(false);

            closeMode();

            return;

        }


        if(
            arrayState[mid].value <
            target
        ){

            log(
                `${arrayState[mid].value} < ${target} → move right.`,
                'info'
            );


            for(
                let i=low;
                i<=mid;
                i++
            ){

                arrayState[i]
                    .status =
                    'disabled';

            }


            low =
                mid+1;

        }

        else{

            log(
                `${arrayState[mid].value} > ${target} → move left.`,
                'info'
            );


            for(
                let i=mid;
                i<=high;
                i++
            ){

                arrayState[i]
                    .status =
                    'disabled';

            }


            high =
                mid-1;

        }


        render();


        await sleep(450);

    }


    log(
        `Mario couldn't find ${target}.`,
        'error'
    );


    soundFail();


    await marioFail(
        token
    );


    resetStatuses();


    hideBinaryMarkers();


    await marioReturnHome(
        token
    );


    setLocked(false);

    closeMode();

}


/* =========================================================
   FORM
========================================================= */

form.addEventListener(
    'submit',
    async event => {

        event.preventDefault();


        if(locked)
            return;


        try{

            if(
                currentMode ===
                'address'
            ){

                await addressCalc();

            }

            else if(
                currentMode ===
                'insert'
            ){

                await insertion();

            }

            else if(
                currentMode ===
                'delete'
            ){

                await deletion();

            }

            else if(
                currentMode ===
                'linear'
            ){

                await linearSearch();

            }

            else if(
                currentMode ===
                'binary'
            ){

                await binarySearch();

            }

        }

        catch(error){

            console.error(
                error
            );


            animationToken++;


            marioIdle();


            log(
                `Unexpected error: ${error.message}`,
                'error'
            );


            setLocked(false);

        }

    }
);


/* =========================================================
   CANCEL
========================================================= */

$('cancelBtn')
.addEventListener(
    'click',
    () => {

        if(locked)
            return;


        animationToken++;


        marioIdle();


        closeMode();

    }
);


/* =========================================================
   OPERATION BUTTONS
========================================================= */

document
.querySelectorAll(
    '.controls .btn'
)
.forEach(
    button => {

        button.addEventListener(
            'click',
            () => {

                resumeAudio();

                soundClick();

                openMode(
                    button.dataset.mode
                );

            }
        );

    }
);


/* =========================================================
   RESET
========================================================= */

$('resetBtn')
.addEventListener(
    'click',
    () => {

        if(!locked){

            resumeAudio();

            soundClick();

            resetGame();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    'resize',
    () => {

        if(!locked){

            render();


            repositionBinaryMarkers();


            if(
                mario.classList.contains(
                    'idle'
                )
            ){

                mario.style.left =
                    '24px';

            }

        }

    }
);


/* =========================================================
   RESET GAME
========================================================= */

function resetGame(){

    animationToken++;


    hideBinaryMarkers();


    locked =
        false;


    marioResetToHome();


    clearLog();


    closeMode();


    const values = [

        45,

        12,

        78,

        34,

        89,

        23,

        56

    ];


    arrayState =
        values.map(
            value => ({

                id:
                    uid(),

                value:
                    value,

                status:
                    ''

            })
        );


    baseAddress =
        DEFAULT_BASE;


    elementSize =
        DEFAULT_ELEMENT_SIZE;


    $('complexity')
        .textContent =
        '—';


    $('modeText')
        .textContent =
        'IDLE';


    $('operationHud')
        .textContent =
        'READY';


    render();


    log(
        'SUPER ARRAY BROS WORLD LOADED!',
        'success'
    );


    log(
        `Initial array: [${values.join(', ')}]`
    );


    log(
        'Mario is ready! Choose an operation.',
        'info'
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

resetGame();

</script>
